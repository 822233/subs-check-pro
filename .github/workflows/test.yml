name: Go 单元测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 编译并运行延迟筛选单元测试
        run: go test ./check -run '^TestLatencyWithinLimit$'
      - name: 编译配置包
        run: go test ./config
