name: Build and publish Linux amd64 release

on:
  push:
    branches:
      - main
      - fix/public-substore-endpoint
      - fix/upx-compressed-linux-release
    paths:
      - '.github/workflows/release-linux-amd64.yml'
      - 'go.mod'
      - 'go.sum'
      - '**.go'
      - 'webui/**'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v3.6.4)
        required: true
        default: v3.6.4
        type: string

permissions:
  contents: write

concurrency:
  group: linux-amd64-release-${{ inputs.version || 'v3.6.4' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version and ensure tag is unused
        id: version
        env:
          VERSION: ${{ inputs.version || 'v3.6.4' }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable version: $VERSION"
            exit 1
          fi
          if ! fork_refs="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git "refs/tags/$VERSION")"; then
            echo "Unable to verify tags in the fork; refusing to publish."
            exit 1
          fi
          if [[ -n "$fork_refs" ]]; then
            echo "Tag $VERSION already exists in this fork."
            exit 1
          fi
          if ! upstream_refs="$(git ls-remote https://github.com/sinspired/subs-check-pro.git "refs/tags/$VERSION")"; then
            echo "Unable to verify upstream tags; refusing to publish."
            exit 1
          fi
          if [[ -n "$upstream_refs" ]]; then
            echo "Tag $VERSION already exists upstream. Choose a new version to avoid ambiguity."
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve pinned WebUI and validate frontend
        run: |
          set -euo pipefail
          go mod download github.com/sinspired/subs-check-pro-webui
          webui_dir="$(go list -f '{{.Dir}}' github.com/sinspired/subs-check-pro-webui/webui)"
          test -n "$webui_dir"
          node --check "$webui_dir/static/js/admin.js"

      - name: Run deterministic tests and static analysis
        run: |
          set -euo pipefail
          go mod download
          go test ./proxy/parse ./check
          go vet ./...

      - name: Build static Linux amd64 binary with upstream cross toolchain
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e VERSION="$VERSION" -e COMMIT="$COMMIT" \
            --entrypoint bash \
            goreleaser/goreleaser-cross:latest \
            -lc '
              set -euo pipefail
              git config --global --add safe.directory /work
              go mod download
              CGO_ENABLED=1 CC=x86_64-linux-gnu-gcc CXX=x86_64-linux-gnu-g++ \
                go build -trimpath -tags=netgo,osusergo \
                -ldflags="-s -w -extldflags \"-static -Wl,-z,stack-size=8388608\" -X main.Version=${VERSION#v} -X main.CurrentCommit=${COMMIT:0:7}" \
                -o dist/subs-check-pro .
            '

      - name: Verify uncompressed binary architecture, static linkage and contents
        env:
          VERSION: ${{ inputs.version || 'v3.6.4' }}
        run: |
          set -euo pipefail
          test -s dist/subs-check-pro
          file_output="$(file dist/subs-check-pro)"
          printf '%s\n' "$file_output"
          grep -E 'ELF 64-bit.*x86-64' <<<"$file_output"
          grep -Fq 'statically linked' <<<"$file_output"
          ldd_output="$(ldd dist/subs-check-pro 2>&1 || true)"
          if ! grep -Fq 'not a dynamic executable' <<<"$ldd_output"; then
            echo "Binary is not confirmed as statically linked:"
            printf '%s\n' "$ldd_output"
            exit 1
          fi
          strings dist/subs-check-pro | grep -Fq 'sub-store-public-url'
          strings dist/subs-check-pro | grep -F "${VERSION#v}" >/dev/null
          stat -c 'Uncompressed size: %s bytes' dist/subs-check-pro

      - name: Install pinned UPX
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/upx.tar.xz https://github.com/upx/upx/releases/download/v5.3.0/upx-5.3.0-amd64_linux.tar.xz
          echo "79cea8a50b6fa102d10c7b79a419cd77dead3cc2d78661de2dc5e5815dc505c1  /tmp/upx.tar.xz" | sha256sum -c -
          mkdir -p /tmp/upx
          tar -xJf /tmp/upx.tar.xz -C /tmp/upx --strip-components=1
          sudo install -m 0755 /tmp/upx/upx /usr/local/bin/upx
          upx --version

      - name: Compress with UPX and verify packed executable
        env:
          VERSION: ${{ inputs.version || 'v3.6.4' }}
        run: |
          set -euo pipefail
          before="$(stat -c %s dist/subs-check-pro)"
          upx --best dist/subs-check-pro
          upx -t dist/subs-check-pro
          packed="$(stat -c %s dist/subs-check-pro)"
          echo "UPX size: ${before} -> ${packed} bytes"
          test "$packed" -lt "$before"
          file dist/subs-check-pro | tee /tmp/packed-file.txt
          grep -E 'ELF 64-bit.*x86-64' /tmp/packed-file.txt
          upx -d -o /tmp/subs-check-pro.unpacked dist/subs-check-pro
          unpacked_info="$(file /tmp/subs-check-pro.unpacked)"
          printf '%s\n' "$unpacked_info"
          grep -Fq 'statically linked' <<<"$unpacked_info"
          strings /tmp/subs-check-pro.unpacked | grep -Fq 'sub-store-public-url'
          strings /tmp/subs-check-pro.unpacked | grep -F "${VERSION#v}" >/dev/null
          rm -f /tmp/subs-check-pro.unpacked
          sha256sum dist/subs-check-pro | tee dist/SHA256SUMS
          printf 'Version: %s\nCommit: %s\nUPX: 5.3.0 (--best)\n' "$VERSION" "${GITHUB_SHA}" > dist/BUILD-INFO.txt

      - name: Upload build artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: subs-check-pro-linux-amd64-${{ steps.version.outputs.tag }}
          path: |
            dist/subs-check-pro
            dist/SHA256SUMS
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with Linux amd64 assets only
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Subs-Check PRO ${{ steps.version.outputs.tag }} (configurable Sub-Store URL)
          body: |
            This release is built from the exact triggering commit on the selected branch.

            - Uses the pinned WebUI fork with a runtime-configurable Sub-Store public URL (`sub-store-public-url` or `SUB_STORE_PUBLIC_URL`).
            - Includes the Linux amd64 static binary only.
            - Existing server configuration, API key, random Sub-Store path and output data are not changed by this release.
            - SHA-256 checksum is provided in `SHA256SUMS`.
          draft: false
          prerelease: false
          files: |
            dist/subs-check-pro
            dist/SHA256SUMS
            dist/BUILD-INFO.txt
