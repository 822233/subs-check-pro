name: 构建并发布 Linux amd64 版本

on:
  push:
    branches:
      - main
      - fix/public-substore-endpoint
      - fix/upx-compressed-linux-release
    paths:
      - 'go.mod'
      - 'go.sum'
      - '**.go'
      - 'webui/**'
      - '.github/workflows/release-linux-amd64.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本号（例如 v3.6.7）
        required: true
        default: v3.6.7
        type: string

permissions:
  contents: write

concurrency:
  group: linux-amd64-release-${{ inputs.version || 'v3.6.7' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 校验版本号并确认标签未被占用
        id: version
        env:
          VERSION: ${{ inputs.version || 'v3.6.7' }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本号格式无效：$VERSION"
            exit 1
          fi
          if ! fork_refs="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git "refs/tags/$VERSION")"; then
            echo "无法验证 Fork 仓库标签，停止发布。"
            exit 1
          fi
          if [[ -n "$fork_refs" ]]; then
            echo "标签 $VERSION 已存在于 Fork 仓库。"
            exit 1
          fi
          if ! upstream_refs="$(git ls-remote https://github.com/sinspired/subs-check-pro.git "refs/tags/$VERSION")"; then
            echo "无法验证上游标签，停止发布。"
            exit 1
          fi
          if [[ -n "$upstream_refs" ]]; then
            echo "标签 $VERSION 已存在于上游仓库，请选择新版本。"
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: 检出本次触发构建的准确提交
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 配置 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 解析固定版本的 WebUI 并检查前端语法
        run: |
          set -euo pipefail
          go mod download github.com/sinspired/subs-check-pro-webui
          webui_dir="$(go list -f '{{.Dir}}' github.com/sinspired/subs-check-pro-webui/webui)"
          test -n "$webui_dir"
          node --check "$webui_dir/static/js/admin.js"

      - name: 运行测试与静态代码检查
        run: |
          set -euo pipefail
          go mod download
          go test ./proxy/parse ./check
          go vet ./...

      - name: 使用交叉编译工具链构建 Linux amd64 静态程序
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e VERSION="$VERSION" -e COMMIT="$COMMIT" \
            --entrypoint bash \
            goreleaser/goreleaser-cross:latest \
            -lc '
              set -euo pipefail
              git config --global --add safe.directory /work
              go mod download
              CGO_ENABLED=1 CC=x86_64-linux-gnu-gcc CXX=x86_64-linux-gnu-g++ \
                go build -trimpath -tags=netgo,osusergo \
                -ldflags="-s -w -extldflags \"-static -Wl,-z,stack-size=8388608\" -X main.Version=${VERSION#v} -X main.CurrentCommit=${COMMIT:0:7}" \
                -o dist/subs-check-pro .
            '

      - name: 检查未压缩程序的架构、静态链接及内容
        env:
          VERSION: ${{ inputs.version || 'v3.6.7' }}
        run: |
          set -euo pipefail
          test -s dist/subs-check-pro
          file_output="$(file dist/subs-check-pro)"
          printf '%s\n' "$file_output"
          grep -E 'ELF 64-bit.*x86-64' <<<"$file_output"
          grep -Fq 'statically linked' <<<"$file_output"
          ldd_output="$(ldd dist/subs-check-pro 2>&1 || true)"
          if ! grep -Fq 'not a dynamic executable' <<<"$ldd_output"; then
            echo "未能确认程序为静态链接："
            printf '%s\n' "$ldd_output"
            exit 1
          fi
          strings dist/subs-check-pro | grep -Fq 'sub-store-public-url'
          strings dist/subs-check-pro | grep -F "${VERSION#v}" >/dev/null
          stat -c '未压缩文件大小：%s 字节' dist/subs-check-pro

      - name: 安装固定版本的 UPX
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/upx.tar.xz https://github.com/upx/upx/releases/download/v5.3.0/upx-5.3.0-amd64_linux.tar.xz
          echo "79cea8a50b6fa102d10c7b79a419cd77dead3cc2d78661de2dc5e5815dc505c1  /tmp/upx.tar.xz" | sha256sum -c -
          mkdir -p /tmp/upx
          tar -xJf /tmp/upx.tar.xz -C /tmp/upx --strip-components=1
          sudo install -m 0755 /tmp/upx/upx /usr/local/bin/upx
          upx --version

      - name: 使用 UPX 压缩并验证程序完整性
        env:
          VERSION: ${{ inputs.version || 'v3.6.7' }}
        run: |
          set -euo pipefail
          before="$(stat -c %s dist/subs-check-pro)"
          upx --best dist/subs-check-pro
          upx -t dist/subs-check-pro
          packed="$(stat -c %s dist/subs-check-pro)"
          echo "UPX 压缩大小：${before} -> ${packed} 字节"
          test "$packed" -lt "$before"
          file dist/subs-check-pro | tee /tmp/packed-file.txt
          grep -E 'ELF 64-bit.*x86-64' /tmp/packed-file.txt
          upx -d -o /tmp/subs-check-pro.unpacked dist/subs-check-pro
          unpacked_info="$(file /tmp/subs-check-pro.unpacked)"
          printf '%s\n' "$unpacked_info"
          grep -Fq 'statically linked' <<<"$unpacked_info"
          strings /tmp/subs-check-pro.unpacked | grep -Fq 'sub-store-public-url'
          strings /tmp/subs-check-pro.unpacked | grep -F "${VERSION#v}" >/dev/null
          rm -f /tmp/subs-check-pro.unpacked
          (cd dist && sha256sum subs-check-pro > SHA256SUMS)
          printf '版本：%s\n提交：%s\nUPX：5.3.0 (--best)\n' "$VERSION" "${GITHUB_SHA}" > dist/BUILD-INFO.txt

      - name: 上传构建产物供检查
        uses: actions/upload-artifact@v4
        with:
          name: subs-check-pro-linux-amd64-${{ steps.version.outputs.tag }}
          path: |
            dist/subs-check-pro
            dist/SHA256SUMS
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: 发布仅包含 Linux amd64 资产的 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Subs-Check PRO ${{ steps.version.outputs.tag }}（Sub-Store 公网地址可配置版）
          body: |
            ## 版本说明

            本版本基于本次触发构建的准确代码提交生成。

            ### 更新内容

            - **Sub-Store 公网地址支持配置**：可通过配置文件中的 `sub-store-public-url` 或环境变量 `SUB_STORE_PUBLIC_URL` 设置公网访问地址。
            - **统一入口**：首页入口与分享链接使用同一配置，避免地址不一致。
            - **兼容性处理**：未配置公网地址时支持自动探测；Wails 桌面端优先使用本地地址。
            - **节点延迟筛选**：复用原有测活 HEAD 请求计时，默认保留响应耗时严格小于 300ms 的节点；可通过 `max-latency` 调整，设置为 `0` 可关闭限制，不增加额外测活请求。
            - **WebUI 配置**：在“延迟参数”的“超时时间”下方新增“节点延迟上限 (ms)”输入项。
            - **程序平台**：提供 Linux amd64 静态编译版本。

            ### 配置与数据说明

            - 更新程序不会主动修改服务器现有配置。
            - 保留原有 API Key、随机 Sub-Store 路径及输出数据。
            - SHA-256 文件校验值见附件 `SHA256SUMS`。

            ### 下载说明

            下载 Linux amd64 对应程序后，建议先核对 SHA-256 校验值，再替换服务器上的旧版本。
          draft: false
          prerelease: false
          files: |
            dist/subs-check-pro
            dist/SHA256SUMS
            dist/BUILD-INFO.txt
